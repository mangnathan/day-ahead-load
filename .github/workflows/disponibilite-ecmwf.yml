# Mesure une fois par jour l'heure de disponibilité du calcul ECMWF IFS 9 km de 00 UTC chez
# Open-Meteo, lue sur l'API (serveur atteint depuis GitHub, en Amérique du Nord d'après sa plage
# d'adresses) et sur la copie publique d'Open-Meteo sur AWS (heure de dépôt du calcul), et l'écrit
# sur la branche de données. Séparé de la CI : la CI et les tests ne font aucun appel réseau. Une
# ligne par jour au plus ; pour chaque source, une seule nouvelle tentative après 2 minutes en cas
# de coupure réseau ou de 5xx (statut « echec » si elle échoue aussi) ; arrêt définitif au 429.
name: Disponibilité ECMWF

on:
  schedule:
    # 9 h UTC : le fichier de l'API ne décrit que le dernier calcul reçu. Sur 95 calculs (août à
    # novembre 2026), celui de 00 UTC est déposé entre 5,9 et 7,2 h après son lancement, celui de
    # 06 UTC vers 12 h UTC : la lecture doit tomber entre les deux. GitHub peut retarder le
    # départ d'une heure ou plus ; chaque ligne garde l'heure réelle de l'appel et le calcul lu.
    - cron: "0 9 * * *"
  workflow_dispatch:

# Écriture nécessaire pour pousser sur la branche de données. La règle de protection de main
# reste en place : ce workflow ne pousse jamais sur main.
permissions:
  contents: write

concurrency:
  group: disponibilite-ecmwf
  cancel-in-progress: false

jobs:
  mesure:
    name: Heure de disponibilité du calcul ECMWF
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: donnees/disponibilite-ecmwf
          path: donnees
          # Le jeton d'écriture n'est pas gardé dans donnees/.git : l'étape de mesure, qui
          # appelle des services externes, ne peut pas le lire. Seul « Enregistrer » le reçoit.
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true

      - name: Installer le paquet sans les outils de développement
        run: uv sync --locked --no-dev

      - name: Mesurer (deux tentatives au plus)
        run: uv run --no-sync python scripts/monitoring/record_ecmwf_availability.py --dossier donnees

      - name: Enregistrer sur la branche de données
        working-directory: donnees
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mesurer la disponibilité du calcul ECMWF du $(date -u +%F)"
          # Jeton passé à cette seule commande, jamais écrit dans la configuration de Git.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            push origin HEAD:donnees/disponibilite-ecmwf
